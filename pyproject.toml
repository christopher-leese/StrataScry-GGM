[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stratascry-ggm"
version = "0.3.0"
description = "A high-resolution Blue Marble globe prototype for StrataScry GGM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Christopher Leese"}]
dependencies = [
  "PySide6>=6.9,<7",
  "pyvista>=0.46,<0.49",
  "pyvistaqt>=0.11,<0.12",
  "numpy>=1.24,<3",
  "rasterio>=1.4.4,<2",
  "pillow>=10,<13",
  "affine>=2.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.gui-scripts]
stratascry = "stratascry.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stratascry*"]

[tool.setuptools.package-data]
stratascry = ["assets/*.jpg", "assets/*.md", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
